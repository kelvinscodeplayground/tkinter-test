[project]
name = "tkinter-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
